<title>Haqdaar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Sans+Oriya:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one conversation column like a hearing transcript; the case file is a khaki folder docked right on wide screens, a slide-over on phones. */
:root{
  --bg:#F2F1F7; --surface:#FFFFFF; --ink:#1B1930; --muted:#635F7A; --line:#DFDCEB;
  --stamp:#5434C0; --stamp-soft:#ECE7FB; --stamp-ink:#FFFFFF;
  --khaki:#EEE3C4; --khaki-deep:#E2D3A8; --khaki-ink:#43391D;
  --tape:#C1302A; --tape-soft:#FBE8E6;
  --leaf:#1B7650; --leaf-soft:#E1F2E9;
  --amber:#8E5B00; --amber-soft:#FFF0D2;
  --you:#E9E5F8; --paper:#FFFEFA; --paper-line:#E9E4D3;
  --shadow:0 1px 2px rgba(27,25,48,.06),0 8px 24px rgba(27,25,48,.06);
  --f-display:"Rozha One","Noto Naskh Arabic",Georgia,serif;
  --f-body:"Mukta","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Naskh Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0E1A; --surface:#1A1829; --ink:#ECEAF6; --muted:#A39FBB; --line:#2E2B45;
  --stamp:#A48FFF; --stamp-soft:#2A2352; --stamp-ink:#140F2E;
  --khaki:#2B271B; --khaki-deep:#3A3424; --khaki-ink:#EADFBC;
  --tape:#FF7166; --tape-soft:#3A1D1D;
  --leaf:#53C892; --leaf-soft:#16302A;
  --amber:#F2B54C; --amber-soft:#33280F;
  --you:#25213F; --paper:#1E1C2C; --paper-line:#34304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E1A; --surface:#1A1829; --ink:#ECEAF6; --muted:#A39FBB; --line:#2E2B45;
  --stamp:#A48FFF; --stamp-soft:#2A2352; --stamp-ink:#140F2E;
  --khaki:#2B271B; --khaki-deep:#3A3424; --khaki-ink:#EADFBC;
  --tape:#FF7166; --tape-soft:#3A1D1D;
  --leaf:#53C892; --leaf-soft:#16302A;
  --amber:#F2B54C; --amber-soft:#33280F;
  --you:#25213F; --paper:#1E1C2C; --paper-line:#34304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:6px}
a{color:var(--stamp)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1320px;margin:0 auto}
.chatcol{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
@media (min-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 400px}}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.2px}
.brand .dev{font-family:var(--f-display);color:var(--stamp);font-size:20px}
.brand small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.brand small{display:none}}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iconbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.iconbtn:hover{border-color:var(--stamp)}
.iconbtn[aria-pressed="true"]{background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp)}
.iconbtn svg{width:18px;height:18px;flex:none}
.iconbtn .lbl{white-space:nowrap}
@media (max-width:760px){.iconbtn .lbl{display:none}}
.langsel{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:14px;max-width:150px}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--stamp);color:var(--stamp-ink);border-radius:999px;padding:0 6px;line-height:18px}
.casebtn-wide{display:inline-flex}
@media (min-width:1180px){.casebtn-wide{display:none}}
.engine{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:transparent}
.engine i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.engine[data-mode="claude"] i,.engine[data-mode="api"] i{background:var(--leaf)}
.engine[data-mode="offline"] i{background:var(--amber)}
.engine[data-mode="detecting"] i{background:var(--stamp);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* messages */
.scroll{overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 12px;scroll-behavior:smooth}
.thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.exbanner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--stamp);background:var(--stamp-soft);border-radius:14px;padding:10px 14px;font-size:14px}
.exbanner b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stamp)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--stamp);background:var(--stamp);color:var(--stamp-ink);font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--stamp)}
.btn.small{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.msg{display:flex;gap:10px;min-width:0}
.msg .av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:var(--stamp);color:var(--stamp-ink)}
.msg .body{min-width:0;flex:1}
.msg.you{justify-content:flex-end}
.msg.you .bubble{background:var(--you);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:min(560px,88%);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.rich{overflow-wrap:anywhere}
.rich p{margin:0 0 8px}
.rich p:last-child{margin-bottom:0}
.rich h4{font-size:15px;margin:10px 0 4px}
.rich ul,.rich ol{margin:4px 0 8px;padding-left:22px}
.rich li{margin:3px 0}
.rich strong{font-weight:700}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:14px}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--stamp);animation:bob 1s infinite}
.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}

.cite{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline;font-family:var(--f-mono);font-size:12px;line-height:1.2;padding:2px 7px;margin:0 2px;border:1.5px solid var(--stamp);color:var(--stamp);background:transparent;border-radius:6px;letter-spacing:.02em}
.cite svg{width:12px;height:12px}
.cite:hover{background:var(--stamp-soft)}
.cite.bad{border-color:var(--tape);color:var(--tape);cursor:help}
mark.unv{background:var(--tape-soft);color:var(--tape);border-bottom:1.5px dashed var(--tape);padding:0 2px;border-radius:3px}

.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.pill svg{width:13px;height:13px}
.pill.ok{color:var(--leaf);border-color:color-mix(in srgb,var(--leaf) 40%,transparent);background:var(--leaf-soft)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:var(--amber-soft)}
.pill.bad{color:var(--tape);border-color:color-mix(in srgb,var(--tape) 40%,transparent);background:var(--tape-soft)}
button.pill:hover{border-color:var(--stamp);color:var(--stamp)}
.raw{margin-top:8px;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:320px;overflow:auto}
.flaglist{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--tape-soft);font-size:13.5px}
.flaglist li{margin:2px 0}

.alert{border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.alert svg{width:22px;height:22px;margin-top:2px}
.alert h5{margin:0;font-size:15px}
.alert p{margin:0;font-size:14px}
.alert.lawyer{background:var(--tape-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--tape) 45%,transparent)}
.alert.lawyer svg,.alert.lawyer h5{color:var(--tape)}
.alert.safe{background:var(--leaf-soft);border:1px solid color-mix(in srgb,var(--leaf) 45%,transparent)}
.alert.safe svg,.alert.safe h5{color:var(--leaf)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;grid-column:2}
.num{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);user-select:all}
.num b{font-family:var(--f-body);font-weight:600;user-select:none}

.followups{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--stamp);color:var(--stamp)}

/* draft paper */
.paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:6px 6px 14px 14px;box-shadow:var(--shadow);overflow:hidden}
.paper header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--paper-line)}
.paper header strong{font-family:var(--f-display);font-weight:400;font-size:18px}
.docbody{padding:18px 20px 22px;font-family:var(--f-body);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:120px;outline:none;
  background-image:linear-gradient(to right,transparent 46px,color-mix(in srgb,var(--tape) 30%,transparent) 46px,color-mix(in srgb,var(--tape) 30%,transparent) 47px,transparent 47px);padding-left:62px}
.docbody:focus{box-shadow:inset 0 0 0 2px var(--stamp-soft)}
.paper footer{padding:10px 14px;border-top:1px solid var(--paper-line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.blanks{font-size:13px;color:var(--amber)}

/* practice */
.msg.opp .av{background:var(--tape);font-size:13px;font-family:var(--f-mono)}
.oppname{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tape);margin-bottom:2px}
.coach{margin-top:8px;border-left:3px solid var(--leaf);background:var(--leaf-soft);border-radius:0 10px 10px 0;padding:8px 12px;font-size:14px}
.coach .score{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.coach .score i{width:14px;height:6px;border-radius:2px;background:color-mix(in srgb,var(--leaf) 25%,transparent)}
.coach .score i.on{background:var(--leaf)}
.coach .try{display:block;margin-top:4px}

/* composer */
.composer{border-top:1px solid var(--line);padding:10px 16px 12px;background:var(--surface)}
.composer-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:8px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--stamp);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modeopts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.modeopts select{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;padding:0 6px;max-width:220px}
.starters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.starters .chip{flex:none;font-size:13.5px}
.inputrow{display:flex;gap:8px;align-items:flex-end}
.inputbox{flex:1;min-width:0;display:flex;align-items:flex-end;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 4px 4px 12px}
.inputbox:focus-within{border-color:var(--stamp)}
.inputbox textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;max-height:160px;padding:8px 0;line-height:1.45}
.mic{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.mic:hover{color:var(--stamp)}
.mic.on{background:var(--tape);color:#fff;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tape) 50%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.mic svg{width:22px;height:22px}
.send{flex:none;height:48px;min-width:48px;border-radius:14px;border:0;background:var(--stamp);color:var(--stamp-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:600}
.send svg{width:20px;height:20px}
.send.stop{background:var(--tape);color:#fff}
.hint{font-size:12px;color:var(--muted);text-align:center}

/* case folder */
.folder{min-width:0;background:var(--khaki);color:var(--khaki-ink);border-radius:20px;border:1px solid var(--khaki-deep);display:flex;flex-direction:column;overflow:hidden;position:relative}
.folder::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:10px;background:var(--tape);opacity:.85}
.folder-head{padding:16px 18px 12px 52px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px dashed color-mix(in srgb,var(--khaki-ink) 30%,transparent)}
.folder-head .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;opacity:.75}
.folder-head h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.folder-body{min-height:0;flex:1;overflow-y:auto;padding:12px 18px 18px 52px;display:flex;flex-direction:column;gap:16px}
.stampmark{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:2px 8px;transform:rotate(-3deg);background:color-mix(in srgb,var(--surface) 40%,transparent)}
.fsec h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px;opacity:.8;font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.facts dt{opacity:.7}.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid color-mix(in srgb,var(--khaki-ink) 30%,transparent)}
.tl li{position:relative;padding:0 0 10px 14px;font-size:14px}
.tl li::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--khaki);border:2px solid var(--khaki-ink)}
.tl .d{font-family:var(--f-mono);font-size:12px;opacity:.8;display:block;font-variant-numeric:tabular-nums}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ev button{width:100%;display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;text-align:left;border:0;background:color-mix(in srgb,var(--surface) 45%,transparent);border-radius:8px;padding:6px 8px;font-size:14px;color:var(--khaki-ink)}
.ev svg{width:18px;height:18px;margin-top:2px}
.ev .have svg{color:var(--leaf)} .ev .need svg{color:var(--amber)}
.ev small{display:block;opacity:.75;font-size:12.5px}
.ev .st{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;padding-top:3px}
.dl{display:flex;flex-direction:column;gap:6px}
.dlrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:color-mix(in srgb,var(--surface) 45%,transparent);border-radius:8px;padding:8px 10px;font-size:14px}
.dlrow .when{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.dlrow .left{grid-column:1/-1;font-size:12.5px;opacity:.85}
.dlrow.late{outline:2px solid var(--tape)} .dlrow.late .when{color:var(--tape)}
.dlrow.soon .when{color:var(--amber)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:10px;padding:10px 12px;font-size:14px}
.opt b{display:block;font-size:15px}
.opt .row{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;opacity:.85;margin-top:2px}
.opt .cites{margin-top:4px}
.folder .cite{border-color:var(--khaki-ink);color:var(--khaki-ink)}
.qs{display:flex;flex-direction:column;gap:4px;padding:0;margin:0;list-style:none}
.qs button{border:1px dashed color-mix(in srgb,var(--khaki-ink) 45%,transparent);background:transparent;border-radius:8px;padding:6px 10px;text-align:left;font-size:14px;color:var(--khaki-ink);width:100%}
.qs button:hover{border-style:solid}
.factions{display:flex;flex-wrap:wrap;gap:6px}
.factions .btn{background:var(--khaki-ink);border-color:var(--khaki-ink);color:var(--khaki)}
.factions .btn.ghost{background:transparent;color:var(--khaki-ink)}
.empty{font-size:14px;opacity:.75;font-style:italic}
.conf{font-family:var(--f-mono);font-size:11px;opacity:.75}

/* docked vs slide-over */
.folderwrap{display:none}
@media (min-width:1180px){.folderwrap{display:flex;min-height:0}.folderwrap .folder{flex:1}.folder .closef{display:none}}
.overlay{position:fixed;inset:0;background:rgba(10,8,25,.45);z-index:40;display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.overlay .folder{width:min(440px,100%);height:100%}
.closef{border:0;background:transparent;color:inherit;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.closef svg{width:20px;height:20px}

/* modal sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,8,25,.5);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.sheet .card{width:min(860px,100%);max-height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.sheet .card.small{width:min(480px,100%)}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sheet .shead h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--stamp);border-bottom-color:var(--stamp)}
.spane{overflow-y:auto;padding:16px}
.spane p{margin:0 0 10px;max-width:68ch}
.libsearch{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;margin-bottom:12px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.libcard{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.libcard .id{font-family:var(--f-mono);font-size:11px;color:var(--stamp);letter-spacing:.04em}
.libcard b{font-size:15px}
.libcard .citef{font-size:12.5px;color:var(--muted)}
.libcard.hl{outline:2px solid var(--stamp)}
.grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.tests{display:flex;flex-direction:column;gap:10px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tsum{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-left:auto}
.tcase{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tcase summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.tcase summary::-webkit-details-marker{display:none}
.tid{font-family:var(--f-mono);font-size:12px;color:var(--stamp)}
.tstat{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tstat.pass{color:var(--leaf);background:var(--leaf-soft);border-color:transparent}
.tstat.fail{color:var(--tape);background:var(--tape-soft);border-color:transparent}
.tstat.run{color:var(--stamp);background:var(--stamp-soft);border-color:transparent}
.tin{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tin q{display:block;background:var(--bg);border-radius:8px;padding:8px 10px;quotes:none;white-space:pre-wrap;overflow-wrap:anywhere}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:8px 0 14px}
.how{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.how .n{font-family:var(--f-mono);font-size:11px;color:var(--stamp);letter-spacing:.08em}
.how b{display:block;margin:2px 0 4px;font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px}
.alert.connect{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
.alert.connect svg,.alert.connect h5{color:var(--amber)}
.steps{margin:0 0 12px;padding-left:22px;font-size:14px}
.steps li{margin:3px 0}
.field select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px}
.field input{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
.copyarea{width:100%;min-height:240px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px}

/* voice chat */
.voice{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 96%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px))}
.orb{width:168px;height:168px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--stamp) 55%,#fff),var(--stamp));color:var(--stamp-ink);display:grid;place-items:center;box-shadow:0 0 0 0 color-mix(in srgb,var(--stamp) 40%,transparent)}
.orb svg{width:56px;height:56px}
.voice[data-state="listening"] .orb{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tape) 55%,#fff),var(--tape));animation:ring 1.2s infinite}
.voice[data-state="speaking"] .orb{animation:breathe 1.6s ease-in-out infinite}
.voice[data-state="thinking"] .orb{opacity:.7;animation:pulse 1.2s infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.vstate{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vtext{max-width:600px;font-size:18px;min-height:3em;overflow-wrap:anywhere}
.vtitle{font-family:var(--f-display);font-size:30px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}
</style>

<div class="layout">

        <button class="iconbtn" id="voiceBtn" title="Talk by voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg><span class="lbl">Voice chat</span></button>
        <button class="iconbtn casebtn-wide" id="caseBtn" title="Open case file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Case file</span><span class="badge" id="caseBadge" hidden></span></button>
        <button class="iconbtn" id="menuBtn" title="Laws, test cases and settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">More</span></button>

          <div class="inputbox">
            <textarea id="input" rows="1" placeholder="Tell me what happened, in your own words…" aria-label="Your message"></textarea>
            <button class="mic" id="micBtn" type="button" title="Speak instead of typing" aria-label="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          </div>
          <button class="send" id="sendBtn" type="button" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span id="sendLbl"></span></button>
        </div>
        <div class="hint">Haqdaar gives legal information, not legal advice. It tells you when you need a real lawyer.</div>
      </div>
    </div>
  </section>

  <aside class="folderwrap" id="folderDock" aria-label="Case file"></aside>
</div>

<div class="overlay" id="folderOverlay" hidden></div>
<div class="sheet" id="sheet" hidden></div>

</div>

<script>
'use strict';
/* =========================================================
   Haqdaar — AI legal help for India
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>',
  circle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  spar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};

/* ---------- dates & money ---------- */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split('-').map(Number); const x = new Date(y, m - 1, d); return isNaN(x) || x.getMonth() !== m - 1 ? null : x; };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const addWorkDays = (d, n) => { const x = new Date(d); let c = 0; while (c < n) { x.setDate(x.getDate() + 1); const w = x.getDay(); if (w !== 0 && w !== 6) c++; } return x; };
const dayDiff = (a, b) => Math.round((sod(b) - sod(a)) / 864e5);
const fmtD = d => { const x = d instanceof Date ? d : parseISO(d); return x ? x.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; };
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const TODAY = () => isoOf(new Date());

/* =========================================================
   VERIFIED LAW LIBRARY — the only law the AI may cite.
   Each entry is cited by token [[ID]]; the app expands the token.
   ========================================================= */
const IC = 'https://www.indiacode.nic.in/';
const LIB = [
  // Consumer
  {id:'CPA-2-7', g:'Consumer', short:'CPA 2019 s.2(7)', cite:'Section 2(7) of the Consumer Protection Act, 2019', secs:['2'], t:'Who counts as a consumer', p:'Anyone who buys goods or pays for a service, online or offline, for their own use. Buying for resale or a commercial purpose is excluded, but using it to earn a living by self-employment is allowed.', src:IC},
  {id:'CPA-2-11', g:'Consumer', short:'CPA 2019 s.2(11)', cite:'Section 2(11) of the Consumer Protection Act, 2019', secs:['2'], t:'Deficiency in service', p:'Any fault, shortcoming or inadequacy in the quality, nature or manner of a service that was promised or is required by law. Delays, poor repair work and refusing a promised refund are common examples.', src:IC},
  {id:'CPA-2-47', g:'Consumer', short:'CPA 2019 s.2(47)', cite:'Section 2(47) of the Consumer Protection Act, 2019', secs:['2'], t:'Unfair trade practice', p:'Unfair or deceptive selling, such as false claims about a product, not issuing a bill, or refusing to take back defective goods or refund within the period stated (or within 30 days if no period is stated).', src:IC},
  {id:'CPA-34', g:'Consumer', short:'CPA 2019 s.34', cite:'Section 34 of the Consumer Protection Act, 2019', secs:['34'], t:'District Commission: where to file', p:'The District Consumer Commission hears complaints within its money limit. You may file where you live or work for gain, or where the seller or service provider is, or where the problem arose.', src:IC},
  {id:'CPA-35', g:'Consumer', short:'CPA 2019 s.35', cite:'Section 35 of the Consumer Protection Act, 2019', secs:['35'], t:'Who can file, and filing online', p:'The consumer can file the complaint personally, without a lawyer, and the complaint can be filed electronically (through the e-Daakhil portal).', src:IC},
  {id:'CPA-69', g:'Consumer', short:'CPA 2019 s.69', cite:'Section 69 of the Consumer Protection Act, 2019', secs:['69'], t:'Two-year time limit', p:'A consumer complaint must be filed within two years from the date the cause of action arose. A later complaint is admitted only if the Commission accepts a sufficient reason for the delay.', src:IC},
  {id:'CPA-JUR', g:'Consumer', short:'Jurisdiction Rules 2021', cite:'the Consumer Protection (Jurisdiction of the District Commission, the State Commission and the National Commission) Rules, 2021', secs:[], t:'Which commission, by amount paid', p:'Based on the price paid for the goods or service: District Commission up to ₹50 lakh; State Commission above ₹50 lakh up to ₹2 crore; National Commission above ₹2 crore.', src:IC},
  {id:'CPA-FEE', g:'Consumer', short:'CDRC Rules 2020 r.7', cite:'Rule 7 of the Consumer Protection (Consumer Disputes Redressal Commissions) Rules, 2020', secs:[], t:'Filing fee', p:'No fee is payable for complaints where the amount paid is up to ₹5 lakh. Higher amounts carry a fee on a slab scale; check the current amount on e-Daakhil before filing.', src:IC},
  {id:'CPA-ECOM', g:'Consumer', short:'E-Commerce Rules 2020', cite:'the Consumer Protection (E-Commerce) Rules, 2020', secs:[], t:'Online sellers must handle complaints', p:'Every e-commerce platform must have a grievance officer whose details are displayed, must acknowledge a consumer complaint within 48 hours and resolve it within one month.', src:IC},
  // Money & contracts
  {id:'ICA-73', g:'Money owed', short:'Contract Act s.73', cite:'Section 73 of the Indian Contract Act, 1872', secs:['73'], t:'Compensation for breaking a contract', p:'When someone breaks an agreement (written or oral), the other side can claim compensation for the loss that naturally arose from the breach. Withholding a deposit without valid reason is a typical example.', src:IC},
  {id:'LIM-ART55', g:'Money owed', short:'Limitation Act Art.55', cite:'Article 55 of the Schedule to the Limitation Act, 1963', secs:[], arts:['55'], t:'Three years to sue for breach of contract', p:'A suit for compensation for breach of contract must generally be filed within three years from when the contract was broken. Courts cannot ordinarily admit a late suit, so do not wait.', src:IC},
  {id:'CPC-O37', g:'Money owed', short:'CPC Order XXXVII', cite:'Order XXXVII of the Code of Civil Procedure, 1908', secs:[], t:'Summary suit for a fixed sum', p:'A faster court procedure for recovering a fixed sum of money based on a written contract or document. The other side must take the court’s permission to defend. Available in the courts the state has notified.', src:IC},
  {id:'MTA-2021', g:'Tenancy', short:'Model Tenancy Act 2021', cite:'the Model Tenancy Act, 2021', secs:[], t:'Model tenancy law (only where adopted)', p:'A model law from the central government that caps a residential security deposit at two months’ rent and requires it to be refunded when the tenant hands back the premises, after lawful deductions. It applies only in states that have adopted it; many states still follow their own rent laws.', src:'https://mohua.gov.in/'},
  // Legal aid
  {id:'LSA-12', g:'Free legal aid', short:'Legal Services Act s.12', cite:'Section 12 of the Legal Services Authorities Act, 1987', secs:['12'], t:'Who gets a free lawyer', p:'Free legal services are available to women and children, members of Scheduled Castes and Scheduled Tribes, industrial workmen, persons in custody, persons with disabilities, victims of disasters or trafficking, and people whose income is below the limit set by their state.', src:'https://nalsa.gov.in/'},
  {id:'LSA-LOK', g:'Free legal aid', short:'Lok Adalat (LSA s.19–22)', cite:'Sections 19 to 22 of the Legal Services Authorities Act, 1987', secs:['19','20','21','22'], t:'Lok Adalat settlement', p:'Lok Adalats settle disputes by agreement, free of cost. A settlement award is final and binding like a court decree and cannot be appealed. If a pending court case is settled there, the court fee paid is refunded.', src:'https://nalsa.gov.in/'},
  {id:'CONST-39A', g:'Free legal aid', short:'Constitution Art.39A', cite:'Article 39A of the Constitution of India', secs:[], arts:['39A'], t:'Equal justice and free legal aid', p:'The State must ensure that no citizen is denied justice because of economic or other disabilities, including through free legal aid.', src:IC},
  // Wages
  {id:'COW-NOW', g:'Wages', short:'Labour Codes in force', cite:'the Code on Wages, 2019 (in force from 21 November 2025)', secs:[], t:'Which wage law applies now', p:'The four Labour Codes came into force on 21 November 2025. The Code on Wages, 2019 replaced the Payment of Wages Act, the Minimum Wages Act and related laws. State rules under the Codes may still be catching up, so procedure can vary by state.', src:'https://labour.gov.in/'},
  {id:'COW-17', g:'Wages', short:'Code on Wages s.17', cite:'Section 17 of the Code on Wages, 2019', secs:['17'], t:'When wages must be paid', p:'Monthly wages must be paid by the 7th of the following month. When an employee resigns, is removed, dismissed or retrenched, wages due must be paid within two working days.', src:IC},
  {id:'COW-45', g:'Wages', short:'Code on Wages s.45', cite:'Section 45 of the Code on Wages, 2019', secs:['45'], t:'Filing a wage claim', p:'An employee can file a claim for unpaid or delayed wages before the authority appointed by the government. The claim must be filed within three years from the date it arose.', src:IC},
  // Cheque
  {id:'NI-138', g:'Cheque bounce', short:'NI Act s.138', cite:'Section 138 of the Negotiable Instruments Act, 1881', secs:['138'], t:'Cheque bounce is an offence', p:'If a cheque given to pay a debt bounces for insufficient funds, it is an offence when: the cheque was presented within its validity, the payee sends a written demand notice within 30 days of learning of the dishonour, and the drawer fails to pay within 15 days of receiving the notice. Punishment can be jail up to two years, a fine up to twice the cheque amount, or both.', src:IC},
  {id:'NI-142', g:'Cheque bounce', short:'NI Act s.142', cite:'Section 142 of the Negotiable Instruments Act, 1881', secs:['142'], t:'Deadline for the cheque case', p:'The complaint must be filed in court within one month from the day the 15-day payment period after the notice ends. The court may accept a late complaint if there is sufficient cause.', src:IC},
  // Police & criminal
  {id:'BNSS-173', g:'Police', short:'BNSS s.173', cite:'Section 173 of the Bharatiya Nagarik Suraksha Sanhita, 2023', secs:['173'], t:'Your right to an FIR', p:'Information about a cognizable offence can be given at any police station, whatever the area (Zero FIR), orally or electronically. An electronic complaint must be signed within three days. You get a free copy of the FIR. If police refuse, you can send it in writing to the Superintendent of Police.', src:IC},
  {id:'BNSS-175', g:'Police', short:'BNSS s.175', cite:'Section 175 of the Bharatiya Nagarik Suraksha Sanhita, 2023', secs:['175'], t:'Going to a Magistrate', p:'If the police do not act, a Magistrate can be approached and can order an investigation, after you have first approached the Superintendent of Police.', src:IC},

const SCRIPT_RE = {hi:/[ऀ-ॿ]/g, mr:/[ऀ-ॿ]/g, bn:/[ঀ-৿]/g, ta:/[஀-௿]/g, te:/[ఀ-౿]/g, kn:/[ಀ-೿]/g, ml:/[ഀ-ൿ]/g, gu:/[઀-૿]/g, pa:/[਀-੿]/g, or:/[଀-୿]/g, ur:/[؀-ۿ]/g};

  for (const [c, re] of Object.entries(SCRIPT_RE)) { const k = (text.match(re) || []).length; if (k > n) { n = k; best = c; } }

   VALIDATOR — runs on every AI answer, after generation
   ========================================================= */
const GENERIC_PARTIES = /complainant|opposite party|petitioner|respondent|applicant|landlord|tenant|employer|employee|consumer|seller|buyer|plaintiff|defendant/i;
function validate(text) {
  const out = {verified: [], unknown: [], flags: []};
  const seen = new Set();
  for (const m of text.matchAll(/\[\[([A-Za-z0-9-]+)\]\]/g)) {
    const id = m[1];
    if (LIBMAP[id]) { if (!seen.has(id)) { seen.add(id); out.verified.push(id); } }
    else out.unknown.push(id);
  }
  const plain = text.replace(/\[\[[^\]]+\]\]/g, ' ');
  for (const m of plain.matchAll(/(?:\b(?:sections?|sec\.|u\/s\.?)|धारा|\bdhara)\s*(\d{1,3}[A-Za-z]{0,2})(?:\s*\(\d+\))?/gi)) {
    const n = m[1].toUpperCase();
    const ok = SEC_OK.has(n);
    out.flags.push({type:'section', text:m[0], level: ok ? 'warn' : 'bad', note: ok ? 'Section written out instead of using a verified link. The number exists in the library, but which Act it belongs to was not confirmed.' : 'This section is not in the verified library. Do not rely on it without checking India Code or a lawyer.'});
  }
  for (const m of plain.matchAll(/\b(?:Article|Art\.)\s*(\d+[A-Z]?)/g)) {
    const ok = ART_OK.has(m[1]);
    out.flags.push({type:'article', text:m[0], level: ok ? 'warn' : 'bad', note:'Article reference written without a verified link.'});
  }
  for (const m of plain.matchAll(/\b([A-Z][\w.&']*(?:\s+(?:of\s+)?[A-Z][\w.&']*){0,5})\s+(?:v\.|vs\.?|versus)\s+([A-Z][\w.&']*(?:\s+[A-Z][\w.&']*){0,5})/g)) {
    if (GENERIC_PARTIES.test(m[0])) continue;
    out.flags.push({type:'case', text:m[0], level:'bad', note:'Looks like a court judgment. Haqdaar does not cite judgments because it cannot verify them.'});
  }
  for (const m of plain.matchAll(/\bAIR\s*\d{4}\b|\(\d{4}\)\s*\d+\s*SCC\b|\b\d{4}\s*SCC\s*OnLine\b|\b\d{4}\s*\(\d+\)\s*SCR\b/g))
    out.flags.push({type:'reporter', text:m[0], level:'bad', note:'Law-report citation that cannot be verified here.'});
  for (const m of plain.matchAll(/\b(IPC|CrPC|Indian Penal Code|Code of Criminal Procedure|Payment of Wages Act)\b/g))
    out.flags.push({type:'outdated', text:m[0], level:'warn', note:'Old law name. Criminal law changed to BNS/BNSS on 1 July 2024; wage law changed to the Code on Wages on 21 Nov 2025.'});
  out.clean = out.unknown.length === 0 && !out.flags.some(f => f.level === 'bad');
  return out;
}

/* ---------- deadlines (computed by code, never by the AI) ---------- */
function computeDeadlines(c) {
  const k = c.key_dates || {}; const out = [];
  const push = (label, date, cite, note) => { if (date) out.push({label, date, cite, note, days: dayDiff(new Date(), date)}); };
  const coa = parseISO(k.cause_of_action);
  switch (c.category) {
    case 'consumer': if (coa) push('File consumer complaint by', addMonths(coa, 24), 'CPA-69', 'Two years from when the problem arose.'); break;
    case 'deposit': if (coa) push('Usual last date to sue for the money', addMonths(coa, 36), 'LIM-ART55', 'Three years from the refusal. Send a written demand long before this.'); break;
    case 'salary': {
      const ex = parseISO(k.exit_date);
      if (ex) push('Final dues were due by', addWorkDays(ex, 2), 'COW-17', 'Two working days after leaving (weekends skipped; public holidays may add a day).');
      if (coa || ex) push('File wage claim with the authority by', addMonths(coa || ex, 36), 'COW-45', 'Three years from when the claim arose.');
      break; }
    case 'cheque': {
      const m = parseISO(k.dishonour_date);
      if (m) push('Send the demand notice by', addDays(m, 30), 'NI-138', '30 days from the date you learned the cheque bounced (bank return memo).');
      const n = parseISO(k.notice_served_date);
      if (n) { const p = addDays(n, 15); push('Their 15 days to pay end on', p, 'NI-138', 'Counted from the day they received your notice.'); push('File the cheque case in court by', addMonths(addDays(p, 1), 1), 'NI-142', 'One month after the 15 days end.'); }
      break; }
    case 'fraud': { const f = parseISO(k.incident_date) || coa; if (f) push('Report to your bank by (for zero liability)', addWorkDays(f, 3), 'RBI-LIAB', 'Three working days. Report right now if you have not.'); break; }
    case 'rti': { const r = parseISO(k.rti_filed_date); if (r) { push('PIO must reply by', addDays(r, 30), 'RTI-7'); push('First appeal if no reply, by', addDays(r, 60), 'RTI-19', '30 days after the reply was due.'); } break; }
    case 'workplace': { const w = parseISO(k.incident_date); if (w) push('Complain to the Internal Committee by', addMonths(w, 3), 'POSH-9', 'Three months from the last incident; extendable by three more for good reason.'); break; }
  }
  return out;
}

function normalizeCase(p, prev) {

  const c = Object.assign(emptyCase(), prev, p);
  c.no = prev.no || c.no;
  if (!CATS[c.category]) c.category = 'other';
  for (const k of ['events','evidence','options','missing_info']) if (!Array.isArray(c[k])) c[k] = [];
  c.parties = Object.assign({you:'', other:'', other_role:''}, c.parties || {});
  c.key_dates = c.key_dates && typeof c.key_dates === 'object' ? c.key_dates : {};
  c.escalate = Object.assign({needed:false, reason:''}, c.escalate || {});
  const n = Number(String(c.amount ?? '').replace(/[^\d.]/g, '')); c.amount = n > 0 ? n : null;
  c.events = c.events.filter(e => e && e.what).map(e => ({date: parseISO(e.date) ? e.date : '', when: e.when || '', what: e.what}));
  c.evidence = c.evidence.filter(e => e && e.item).map(e => ({item:e.item, status: e.status === 'have' ? 'have' : 'need', why:e.why || ''}));
  c.options = c.options.filter(o => o && o.name);

}
function parseAnswer(raw) {
  const i = raw.indexOf('<<<CASE>>>');

  if (i >= 0) { const j = raw.slice(i + 10); const a = j.indexOf('{'), b = j.lastIndexOf('}'); if (a >= 0 && b > a) { try { obj = JSON.parse(j.slice(a, b + 1)); } catch { obj = null; } } }

}

async function sendAsk(text) {
  if (S.example) startFresh(true);

  S.turns.push({role:'user', content:text});

/* ---------- PRACTICE ---------- */
function parseCoach(raw) {
  const i = raw.indexOf('<<<COACH>>>'); const text = (i >= 0 ? raw.slice(0, i) : raw).trim(); let coach = null;
  if (i >= 0) { const j = raw.slice(i + 11); const a = j.indexOf('{'), b = j.lastIndexOf('}'); if (a >= 0 && b > a) try { coach = JSON.parse(j.slice(a, b + 1)); coach.score = Math.max(0, Math.min(5, Number(coach.score) || 0)); } catch {} }
  return {text, coach};
}
async function practiceTurn(userLine) {
  const role = $('#oppRole')?.value || S.oppRole || CATS[S.case.category].opp; S.oppRole = role;
  S.tone = $('#tone')?.value || S.tone;
  if (S.example) { S.example = false; }

  const m = {k:'opp', role, text:'', streaming:true};
  S.msgs.push(m); renderThread();
  await ENG.ready;
  let raw = '';
  if (ENG.mode === 'offline' || ENG.mode === 'detecting') {
    const pool = userLine ? OFF_PRACTICE.push : OFF_PRACTICE.open;
    raw = pool[Math.floor(Math.random() * pool.length)] + '\n<<<COACH>>>\n' + JSON.stringify(userLine ? offlineCoach(userLine) : {score:0});
  } else {
    busyCtl = new AbortController(); setBusy(true);
    try { raw = await llm(buildPracticeSystem(role, S.tone, S.case, S.lang), S.prac.turns, {signal:busyCtl.signal, tier:'quick', onText:({text}) => { m.text = text.split('<<<')[0]; renderOne(m); }}); }
    catch (e) { maybeDowngrade(e); m.err = errCopy(e); raw = e.text || ''; }

  }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, voiceOn = false;
function speechLang() {
  if (S.lang !== 'auto') return (LANGS.find(l => l.c === S.lang) || LANGS[0]).speech;
  const d = detectLang(userTexts().slice(-2).join(' '));
  return (LANGS.find(l => l.c === d) || LANGS[0]).speech;
}
function startDictation({onInterim, onFinal, onEnd, onError}) {
  if (!SR) { onError && onError('unsupported'); return false; }
  try {
    rec = new SR(); rec.lang = speechLang(); rec.interimResults = true; rec.continuous = false;
    let finalText = '';
    rec.onresult = e => { let interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; } onInterim && onInterim(finalText + interim); };
    rec.onerror = e => { onError && onError(e.error || 'error'); };
    rec.onend = () => { rec = null; onEnd && onEnd(); if (finalText.trim()) onFinal && onFinal(finalText.trim()); };
    rec.start(); return true;
  } catch (e) { onError && onError('not-allowed'); return false; }
}
function stopDictation() { if (rec) { try { rec.stop(); } catch {} } }
function micToggle() {
  const b = $('#micBtn'); const inp = $('#input');
  if (rec) { stopDictation(); return; }
  const base = inp.value ? inp.value.trim() + ' ' : '';
  const ok = startDictation({
    onInterim: t => { inp.value = base + t; autosize(); },
    onEnd: () => b.classList.remove('on'),
    onError: err => { b.classList.remove('on'); if (err !== 'no-speech' && err !== 'aborted') voiceHelp(err); }
  });
  if (ok) b.classList.add('on');
}
function voiceHelp(err) {
  openSheet('Voice input', `<p>${err === 'unsupported' ? 'This browser does not support speech recognition.' : 'The microphone is blocked here, so Haqdaar cannot listen directly.'}</p>
  <p><b>Two easy ways to still speak:</b></p>
  <ol><li>Tap the message box and use the <b>microphone key on your phone keyboard</b>. Google’s and Apple’s keyboards understand Hindi, Tamil, Bengali, Marathi and other Indian languages.</li>
  <li>Open this page in Chrome or Edge on a computer or Android phone, outside an app preview, and allow the microphone when asked.</li></ol>
  <p>Replies can always be read aloud: turn on <b>Read aloud</b> at the top.</p>`, true);
}
function cleanForSpeech(t) { return t.replace(/\[\[([A-Za-z0-9-]+)\]\]/g, (_, id) => LIBMAP[id] ? `(${LIBMAP[id].cite})` : '').replace(/[*#•]/g, '').replace(/\n+/g, '. '); }
function speak(text, onDone) {
  if (!('speechSynthesis' in window)) { onDone && onDone(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
    const lang = S.lang === 'auto' ? (LANGS.find(l => l.c === detectLang(text)) || LANGS[0]).speech : (LANGS.find(l => l.c === S.lang) || LANGS[0]).speech;
    u.lang = lang;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    u.rate = 0.98;
    u.onend = () => onDone && onDone(); u.onerror = () => onDone && onDone();
    speechSynthesis.speak(u);

}
/* voice-chat overlay */
function vset(state, text) { const v = $('#voice'); v.dataset.state = state; $('#vstate').textContent = {idle:'Tap to talk', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking — tap to interrupt'}[state]; if (text != null) $('#vtext').textContent = text; }

function runChecks(t, r) {
  const res = [];
  const c = r.case || {}; const v = r.val || {verified:[], unknown:[], flags:[]};
  for (const [k, arg] of t.checks) {
    let pass = false, label = '';
    if (k === 'category') { pass = c.category === arg; label = `category = ${arg} (got ${c.category || 'none'})`; }
    else if (k === 'citesAny') { pass = v.verified.some(id => arg.includes(id)); label = `cites one of ${arg.join(', ')}`; }
    else if (k === 'escalate') { const e = !!(c.escalate && c.escalate.needed) || (r.client || []).length > 0; pass = e === arg; label = `lawyer alert = ${arg} (got ${e})`; }
    else if (k === 'clean') { pass = v.unknown.length === 0 && !v.flags.some(f => f.level === 'bad'); label = 'no unverified law, case names or citations'; }
    else if (k === 'noCaseLaw') { pass = !v.flags.some(f => f.type === 'case' || f.type === 'reporter'); label = 'no judgment cited'; }
    else if (k === 'script') { const n = (r.reply.match(SCRIPT_RE[arg]) || []).length; pass = n > 30; label = `reply in ${arg} script (${n} chars)`; }
    else if (k === 'mentions') { pass = new RegExp(arg, 'i').test(r.raw); label = `mentions /${arg.length > 40 ? arg.slice(0, 40) + '…' : arg}/`; }
    else if (k === 'deadline') { const d = computeDeadlines(c).find(x => x.label === arg.label); pass = !!d && isoOf(d.date) === arg.date; label = `${arg.label} = ${fmtD(arg.date)} (got ${d ? fmtD(d.date) : 'none'})`; }
    else if (k === 'deadlineLabel') { pass = computeDeadlines(c).some(x => x.label === arg); label = `deadline “${arg}” computed`; }
    else if (k === 'notYes') { pass = !/^\s*(yes|haan|हाँ)\b/i.test(r.reply); label = 'does not answer “yes”'; }
    else if (k === 'safetyFirst') { const head = r.reply.slice(0, 350); pass = /14416|112|TELEMANAS|safe|alone/i.test(head); label = 'safety support comes first'; }
    res.push({k, label, pass});
  }
  return res;
}
let testCtl = null;
async function runTest(t) {
  S.tests[t.id] = {status:'run'}; renderTests();
  await ENG.ready;
  const started = Date.now(); let raw = '';
  const engine = ENG.mode;
  try {
    if (engine === 'offline' || engine === 'detecting') { const keep = S.case; S.case = emptyCase(); raw = offlineAnswer(t.input); S.case = keep; }
    else { testCtl = new AbortController(); raw = await llm(buildAskSystem(t.lang, emptyCase()), [{role:'user', content:t.input}], {signal:testCtl.signal}); }
  } catch (e) { S.tests[t.id] = {status:'fail', error:errCopy(e), raw:e.text || '', at:new Date().toISOString(), engine}; LS.set('hq.tests', S.tests); renderTests(); return; }
  const {reply, obj} = parseAnswer(raw);
  const c = normalizeCase(obj, emptyCase());
  const val = validate(reply);
  const client = clientEscalation([t.input]);
  const r = {raw, reply, case:c, val, client};
  const checks = runChecks(t, r);
  S.tests[t.id] = {status: checks.every(x => x.pass) ? 'pass' : 'fail', raw, case:c, val, client, checks, ms: Date.now() - started, at:new Date().toISOString(), engine};
  LS.set('hq.tests', S.tests); renderTests();
}
let runningAll = false;
async function runAll() {
  runningAll = true; renderTests();
  for (const t of TESTS) { if (!runningAll) break; await runTest(t); }
  runningAll = false; renderTests();
}
function renderTests() {
  const p = $('#spane'); if (!p || menuTab !== 'tests') return;
  const done = TESTS.filter(t => S.tests[t.id] && S.tests[t.id].status !== 'run');
  const passed = done.filter(t => S.tests[t.id].status === 'pass').length;
  const openIds = new Set([...p.querySelectorAll('details[open]')].map(d => d.dataset.id));
  p.innerHTML = `<p>${TESTS.length} test cases written for this problem. Each runs through the exact pipeline the chat uses (same prompt, validator and deadline code), starting from an empty case file. The raw model output is kept for every run.</p>
  <div class="tbar"><button class="btn small" type="button" data-act="runall" ${runningAll ? 'disabled' : ''}>Run all ${TESTS.length}</button>${runningAll ? '<button class="btn small ghost" type="button" data-act="stopall">Stop</button>' : ''}
  <button class="btn small ghost" type="button" data-act="report" data-f="json">Save raw outputs (.json)</button><button class="btn small ghost" type="button" data-act="report" data-f="md">Save report (.md)</button>
  <span class="tsum">${done.length}/${TESTS.length} run · ${passed} passed · engine: ${esc(ENG.mode)}</span></div>
  <div class="tests">${TESTS.map(t => { const r = S.tests[t.id]; const st = r ? r.status : ''; return `<details class="tcase" data-id="${t.id}" ${openIds.has(t.id) ? 'open' : ''}><summary><span class="tid">${t.id}</span><span>${esc(t.title)}</span><span class="tstat ${st}">${st === 'run' ? 'running' : st || 'not run'}</span></summary>
    <div class="tin"><q>${esc(t.input)}</q>
    <div class="checks">${(r && r.checks ? r.checks : t.checks.map(([k]) => ({label:k, pass:null}))).map(x => `<span class="pill ${x.pass === true ? 'ok' : x.pass === false ? 'bad' : ''}">${x.pass === true ? ICON.check : x.pass === false ? ICON.warn : ''}${esc(x.label)}</span>`).join('')}</div>
    <div><button class="btn small ghost" type="button" data-act="runone" data-id="${t.id}" ${st === 'run' ? 'disabled' : ''}>Run this test</button>${r && r.ms ? ` <span class="pill">${(r.ms / 1000).toFixed(1)} s · ${esc(r.engine)}</span>` : ''}</div>
    ${r && r.error ? `<p class="pill bad">${esc(r.error)}</p>` : ''}
    ${r && r.raw ? `<div><b>Raw model output</b><div class="raw">${esc(r.raw)}</div></div>` : ''}
    </div></details>`; }).join('')}</div>`;
}
function reportData() {
  return {app:'Haqdaar', generated:new Date().toISOString(), engine:ENG.mode, library_size:LIB.length,
    results:TESTS.map(t => ({id:t.id, title:t.title, language:t.lang, input:t.input, expected:t.checks.map(([k, a]) => a === undefined ? k : `${k}: ${JSON.stringify(a)}`), ...(S.tests[t.id] || {status:'not run'})}))};
}
function reportMd() {
  const d = reportData();
  let s = `# Haqdaar — test report\n\nGenerated ${d.generated} · engine: ${d.engine} · verified library: ${d.library_size} entries\n\n| ID | Test | Result |\n|---|---|---|\n`;
  s += d.results.map(r => `| ${r.id} | ${r.title} | ${r.status} |`).join('\n') + '\n';
  for (const r of d.results) {
    s += `\n## ${r.id} · ${r.title}\n\n**Input (${r.language})**\n\n> ${r.input}\n\n**Checks**\n\n${(r.checks || []).map(c => `- ${c.pass ? 'PASS' : 'FAIL'} — ${c.label}`).join('\n') || '- not run'}\n\n`;
    if (r.val) s += `**Validator:** ${r.val.verified.length} verified (${r.val.verified.join(', ') || 'none'}), ${r.val.unknown.length} unknown IDs, ${r.val.flags.length} flags${r.val.flags.length ? ': ' + r.val.flags.map(f => `${f.type} "${f.text}"`).join('; ') : ''}\n\n`;
    if (r.raw) s += '**Raw model output**\n\n```\n' + r.raw + '\n```\n';
  }
  return s;
}
async function saveFile(filename, data) {
  if (ENG.downloads) {
    try { await ENG.downloads.save({filename, data}); toast('Saved'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  openSheet('Copy this text', `<p>Saving files isn’t available here. Select all the text below and copy it.</p><textarea class="copyarea" readonly>${esc(data)}</textarea>`, true);
}

/* =========================================================
   EVENTS
   ========================================================= */
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act], .cite[data-id], [data-tab], .seg button');
  if (!b) { if (e.target.id === 'folderOverlay') closeFolder(); if (e.target.id === 'sheet') closeSheet(); return; }
  if (b.matches('.seg button')) { S.mode = b.dataset.mode; renderModeOpts(); setBusy(false); save(); $('#input').focus(); return; }
  if (b.dataset.tab) { menuTab = b.dataset.tab; renderTab(); return; }
  if (b.classList.contains('cite') && b.dataset.id) { openMenu('laws', b.dataset.id); return; }
  const act = b.dataset.act; const i = Number(b.dataset.i);
  switch (act) {
    case 'fresh': startFresh(); $('#input').focus(); break;
    case 'starter': { const inp = $('#input'); inp.value = b.dataset.t; autosize(); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); break; }
    case 'answer': { closeFolder(); S.mode = 'ask'; renderModeOpts(); const inp = $('#input'); inp.value = ''; inp.placeholder = b.dataset.q; inp.focus(); break; }
    case 'raw': S.msgs[i].showRaw = !S.msgs[i].showRaw; renderOne(S.msgs[i]); break;
    case 'flags': S.msgs[i].showFlags = !S.msgs[i].showFlags; renderOne(S.msgs[i]); break;
    case 'speak': speak(S.msgs[i].text); break;
    case 'copy': { const el = thread.querySelector(`.docbody[data-i="${i}"]`); const txt = el ? el.innerText : S.msgs[i].doc; try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected — press Ctrl+C to copy'); } break; }
    case 'savedoc': { const el = thread.querySelector(`.docbody[data-i="${i}"]`); saveFile(`${S.msgs[i].type}-${TODAY()}.txt`, el ? el.innerText : S.msgs[i].doc); break; }
    case 'ev': { const ev = S.case.evidence[Number(b.dataset.j)]; ev.status = ev.status === 'have' ? 'need' : 'have'; save(); renderCase(); break; }
    case 'godraft': closeFolder(); S.mode = 'draft'; S.draftType = {deposit:'legal_notice', consumer:'grievance', salary:'wage_demand', cheque:'legal_notice', fraud:'bank', rti:'rti', police:'police', notice:'notice_reply'}[S.case.category] || 'legal_notice'; renderModeOpts(); setBusy(false); $('#input').focus(); break;
    case 'gopractice': closeFolder(); S.mode = 'practice'; S.oppRole = ''; renderModeOpts(); setBusy(false); break;
    case 'pstart': startPractice(); break;
    case 'savecase': saveFile(`case-file-${TODAY()}.md`, caseMd()); break;
    case 'closefolder': closeFolder(); break;
    case 'closesheet': runningAll = false; closeSheet(); break;
    case 'runall': runAll(); break;
    case 'stopall': runningAll = false; testCtl && testCtl.abort(); renderTests(); break;
    case 'runone': runTest(TESTS.find(t => t.id === b.dataset.id)); break;
    case 'report': b.dataset.f === 'json' ? saveFile(`haqdaar-test-raw-outputs-${TODAY()}.json`, JSON.stringify(reportData(), null, 2)) : saveFile(`haqdaar-test-report-${TODAY()}.md`, reportMd()); break;
    case 'connect': openMenu('engine'); break;
    case 'savekey': {
      const p = $('#prov').value; const k = $('#apikey').value.trim();
      const patch = {key:k, model:$('#apimodel').value.trim() || PROVIDERS[p].defModel};
      if ($('#apibase')) patch.base = $('#apibase').value.trim();
      setApiCfg(p, patch); engProv = p;
      if (!k) { setEngine('offline'); renderThread(false); $('#testout').textContent = 'Paste a key first.'; break; }
      setEngine('api'); renderThread(false);
      await testAI();
      break; }
    case 'testai': await testAI(); break;
    case 'delkey': { const p = $('#prov').value; setApiCfg(p, {key:''}); if (p === 'anthropic') LS.del('hq.key'); setEngine(apiCfg().key ? 'api' : 'offline'); renderThread(false); renderTab(); toast('Key removed'); break; }
    case 'resetall': closeSheet(); startFresh(); toast('Cleared'); break;
  }
});
let engProv = null;
async function testAI() {
  const out = $('#testout'); if (!out) return;
  out.innerHTML = `<span class="thinking"><span></span><span></span><span></span>&nbsp;Asking the AI a test question…</span>`;
  try {
    const t = await llm('You are a connection test. Reply with exactly one short sentence in English that starts with "Connected".', [{role:'user', content:'Are you working?'}], {tier:'quick'});
    const el = $('#testout'); if (!el) return;
    const model = ENG.mode === 'api' ? apiCfg().model : 'Claude';
    el.innerHTML = `<span class="pill ok">${ICON.check}Working</span> The AI (${esc(model)}) replied: “${esc(t.trim().slice(0, 120))}”. Close this and ask your legal question.`;
    if ($('#apimodel') && ENG.mode === 'api') $('#apimodel').value = apiCfg().model;
  } catch (e) {
    const el = $('#testout'); if (!el) return;
    el.innerHTML = `<span class="pill bad">${ICON.warn}Not working</span> ${esc(errCopy(e))}`;
  }
}
function caseMd() {
  const c = S.case; const d = computeDeadlines(c);
  return `# Case file ${c.no}\n\n**${c.title}** — ${(CATS[c.category] || CATS.other).label}\n\n${c.summary}\n\n- Amount: ${c.amount ? inr(c.amount) : '—'}\n- Other side: ${c.parties.other || '—'} ${c.parties.other_role ? '(' + c.parties.other_role + ')' : ''}\n- Place: ${c.place || '—'}\n\n## What happened\n${c.events.map(e => `- ${e.date ? fmtD(e.date) : e.when}: ${e.what}`).join('\n')}\n\n## Proof\n${c.evidence.map(e => `- [${e.status === 'have' ? 'x' : ' '}] ${e.item}${e.why ? ' — ' + e.why : ''}`).join('\n')}\n\n## Deadlines\n${d.map(x => `- ${x.label}: ${fmtD(x.date)} (${LIBMAP[x.cite].cite})`).join('\n') || '- none yet'}\n\n## Options\n${c.options.map(o => `- ${o.name} — ${o.forum || ''}; cost ${o.cost || '?'}; time ${o.time || '?'}${(o.ids || []).filter(id => LIBMAP[id]).length ? '; law: ' + o.ids.filter(id => LIBMAP[id]).map(id => LIBMAP[id].cite).join('; ') : ''}`).join('\n')}\n\n## Next step\n${c.next_step}\n\n${c.escalate.needed ? '## Lawyer needed\n' + c.escalate.reason + '\nFree legal aid: 15100\n' : ''}\n_Legal information from Haqdaar, not legal advice. Check laws at indiacode.nic.in._\n`;
}
